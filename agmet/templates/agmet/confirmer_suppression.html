{% extends 'agmet/base.html' %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ titre }}
      </div>
      <div class="card-body text-center">
        <p class="mb-4">Êtes-vous sûr de vouloir supprimer <strong>{{ objet }}</strong> ?<br>
          <small class="text-muted">Cette action est irréversible.</small>
        </p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-3">
            <i class="bi bi-trash me-1"></i>Oui, supprimer
          </button>
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
