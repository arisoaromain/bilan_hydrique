<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Bilan Hydrique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --primary: #1a5276; --secondary: #2e86c1; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d2137 0%, #1a5276 45%, #2e86c1 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem 0;
    }

    .bg-drops { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .drop {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.06);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .auth-card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      width: 100%; max-width: 480px;
      padding: 2.5rem 2.2rem;
      position: relative; z-index: 1;
      animation: slideUp .5s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .auth-logo {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 6px 20px rgba(26,82,118,0.35);
    }

    .form-control:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(46,134,193,0.18);
    }
    .input-group-text { background: #f0f4f8; border-right: none; color: var(--primary); }
    .form-control     { border-left: none; }

    .btn-register {
      background: linear-gradient(135deg, #1e8449, #27ae60);
      border: none; border-radius: 10px;
      font-weight: 600; letter-spacing: .5px;
      padding: .7rem;
      transition: opacity .2s, transform .15s;
    }
    .btn-register:hover { opacity: .92; transform: translateY(-1px); }

    .divider { display: flex; align-items: center; gap: .8rem; color: #aaa; font-size: .85rem; }
    .divider::before, .divider::after { content:''; flex: 1; height: 1px; background: #e0e0e0; }

    .toggle-pwd { cursor: pointer; background: #f0f4f8; border: 1px solid #ced4da;
                  border-left: none; border-radius: 0 8px 8px 0; }
    .toggle-pwd:hover { background: #e3ecf5; }

    .pwd-strength { height: 5px; border-radius: 3px; transition: all .3s; margin-top: 6px; }
    .strength-text { font-size: .75rem; }

    .field-valid   { border-color: #27ae60 !important; }
    .field-invalid { border-color: #c0392b !important; }
  </style>
</head>
<body>

<div class="bg-drops" id="bgDrops"></div>

<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo">
    <i class="bi bi-person-plus-fill text-white" style="font-size:1.8rem"></i>
  </div>

  <h4 class="text-center fw-bold mb-0" style="color:var(--primary)">Créer un compte</h4>
  <p class="text-center text-muted small mb-3">Rejoignez la plateforme Bilan Hydrique</p>

  <!-- Alertes -->
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }} alert-dismissible fade show py-2 px-3 small mb-3">
        <i class="bi bi-{% if msg.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %} me-1"></i>
        {{ msg }}
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <!-- Formulaire -->
  <form method="post" novalidate id="registerForm">
    {% csrf_token %}

    <!-- Prénom + Nom -->
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label fw-semibold small" style="color:var(--primary)">Prénom</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="first_name" class="form-control" placeholder="Prénom"
                 value="{{ request.POST.first_name|default:'' }}">
        </div>
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold small" style="color:var(--primary)">Nom</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="last_name" class="form-control" placeholder="Nom"
                 value="{{ request.POST.last_name|default:'' }}">
        </div>
      </div>
    </div>

    <!-- Nom d'utilisateur -->
    <div class="mb-3">
      <label class="form-label fw-semibold small" style="color:var(--primary)">
        <i class="bi bi-at me-1"></i>Nom d'utilisateur <span class="text-danger">*</span>
      </label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
        <input type="text" name="username" id="username" class="form-control"
               placeholder="ex: jean.rakoto" autocomplete="username" required autofocus
               value="{{ request.POST.username|default:'' }}"
               oninput="checkUsername(this)">
        <span class="input-group-text" id="usernameIcon" style="border-left:none;background:#f0f4f8"></span>
      </div>
      <div class="form-text" id="usernameHelp">Lettres, chiffres, points et tirets uniquement.</div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-semibold small" style="color:var(--primary)">
        <i class="bi bi-envelope me-1"></i>Adresse e-mail
      </label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
        <input type="email" name="email" class="form-control"
               placeholder="exemple@mail.com" autocomplete="email"
               value="{{ request.POST.email|default:'' }}">
      </div>
    </div>

    <!-- Mot de passe -->
    <div class="mb-3">
      <label class="form-label fw-semibold small" style="color:var(--primary)">
        <i class="bi bi-lock me-1"></i>Mot de passe <span class="text-danger">*</span>
      </label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" name="password1" id="pwd1" class="form-control"
               placeholder="Min. 6 caractères" autocomplete="new-password" required
               oninput="checkStrength(this.value); checkMatch()">
        <button type="button" class="toggle-pwd btn" onclick="togglePwd('pwd1','eye1')">
          <i class="bi bi-eye" id="eye1"></i>
        </button>
      </div>
      <!-- Jauge de force -->
      <div class="pwd-strength bg-secondary mt-2" id="strengthBar" style="width:0%"></div>
      <div class="strength-text text-muted mt-1" id="strengthText"></div>
    </div>

    <!-- Confirmation -->
    <div class="mb-4">
      <label class="form-label fw-semibold small" style="color:var(--primary)">
        <i class="bi bi-lock-check me-1"></i>Confirmer le mot de passe <span class="text-danger">*</span>
      </label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" name="password2" id="pwd2" class="form-control"
               placeholder="Retapez le mot de passe" autocomplete="new-password" required
               oninput="checkMatch()">
        <button type="button" class="toggle-pwd btn" onclick="togglePwd('pwd2','eye2')">
          <i class="bi bi-eye" id="eye2"></i>
        </button>
      </div>
      <div class="form-text" id="matchMsg"></div>
    </div>

    <button type="submit" class="btn btn-register w-100 text-white" id="btnSubmit">
      <i class="bi bi-person-check me-2"></i>Créer mon compte
    </button>
  </form>

  <div class="divider my-3">ou</div>

  <div class="text-center">
    <p class="mb-0 small text-muted">Déjà inscrit ?</p>
    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm mt-2 px-4 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-1"></i>Se connecter
    </a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── Bulles flottantes ──────────────────────────────────────
const container = document.getElementById('bgDrops');
for (let i = 0; i < 18; i++) {
  const d = document.createElement('div');
  d.className = 'drop';
  const size = 20 + Math.random() * 80;
  d.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    animation-duration:${8 + Math.random()*12}s;
    animation-delay:${Math.random()*10}s;
  `;
  container.appendChild(d);
}

// ── Afficher/masquer mot de passe ─────────────────────────
function togglePwd(inputId, iconId) {
  const inp = document.getElementById(inputId);
  const ico = document.getElementById(iconId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  ico.className = inp.type === 'text' ? 'bi bi-eye-slash' : 'bi bi-eye';
}

// ── Validation username en temps réel ─────────────────────
function checkUsername(input) {
  const val = input.value.trim();
  const icon = document.getElementById('usernameIcon');
  const help = document.getElementById('usernameHelp');
  const valid = /^[\w.@+-]{3,}$/.test(val);

  if (!val) {
    input.classList.remove('field-valid','field-invalid');
    icon.innerHTML = '';
    help.textContent = 'Lettres, chiffres, points et tirets uniquement.';
    help.className = 'form-text';
    return;
  }
  if (valid) {
    input.classList.add('field-valid'); input.classList.remove('field-invalid');
    icon.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i>';
    help.textContent = 'Nom d\'utilisateur valide.';
    help.className = 'form-text text-success';
  } else {
    input.classList.add('field-invalid'); input.classList.remove('field-valid');
    icon.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i>';
    help.textContent = 'Minimum 3 caractères, pas d\'espaces ni caractères spéciaux.';
    help.className = 'form-text text-danger';
  }
}

// ── Jauge force du mot de passe ───────────────────────────
function checkStrength(pwd) {
  const bar  = document.getElementById('strengthBar');
  const text = document.getElementById('strengthText');
  let score = 0;
  if (pwd.length >= 6)  score++;
  if (pwd.length >= 10) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;

  const levels = [
    { pct: '0%',   color: '#e0e0e0', label: '' },
    { pct: '20%',  color: '#c0392b', label: '😟 Très faible' },
    { pct: '40%',  color: '#e67e22', label: '😐 Faible' },
    { pct: '60%',  color: '#f1c40f', label: '🙂 Moyen' },
    { pct: '80%',  color: '#27ae60', label: '😊 Fort' },
    { pct: '100%', color: '#1a5276', label: '💪 Très fort' },
  ];
  const lvl = levels[score];
  bar.style.width = lvl.pct;
  bar.style.background = lvl.color;
  text.textContent = lvl.label;
  text.style.color = lvl.color;
}

// ── Vérification correspondance mots de passe ─────────────
function checkMatch() {
  const p1 = document.getElementById('pwd1').value;
  const p2 = document.getElementById('pwd2').value;
  const msg = document.getElementById('matchMsg');
  const inp2 = document.getElementById('pwd2');
  if (!p2) { msg.textContent = ''; inp2.classList.remove('field-valid','field-invalid'); return; }
  if (p1 === p2) {
    msg.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>Les mots de passe correspondent.</span>';
    inp2.classList.add('field-valid'); inp2.classList.remove('field-invalid');
  } else {
    msg.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>Les mots de passe ne correspondent pas.</span>';
    inp2.classList.add('field-invalid'); inp2.classList.remove('field-valid');
  }
}
</script>
</body>
</html>
