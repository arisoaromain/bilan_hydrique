<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Bilan Hydrique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --primary: #1a5276; --secondary: #2e86c1; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d2137 0%, #1a5276 45%, #2e86c1 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Particules flottantes */
    .bg-drops { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .drop {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.06);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0.8); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .auth-card {
      background: rgba(255,255,255,0.97);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      width: 100%; max-width: 420px;
      padding: 2.5rem 2.2rem;
      position: relative; z-index: 1;
      animation: slideUp .5s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .auth-logo {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 6px 20px rgba(26,82,118,0.35);
    }

    .form-control:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(46,134,193,0.18);
    }
    .input-group-text { background: #f0f4f8; border-right: none; color: var(--primary); }
    .form-control     { border-left: none; }

    .btn-login {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none; border-radius: 10px;
      font-weight: 600; letter-spacing: .5px;
      padding: .7rem;
      transition: opacity .2s, transform .15s;
    }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); }

    .divider { display: flex; align-items: center; gap: .8rem; color: #aaa; font-size: .85rem; }
    .divider::before, .divider::after { content:''; flex: 1; height: 1px; background: #e0e0e0; }

    .toggle-pwd { cursor: pointer; background: #f0f4f8; border: 1px solid #ced4da;
                  border-left: none; border-radius: 0 8px 8px 0; }
    .toggle-pwd:hover { background: #e3ecf5; }
  </style>
</head>
<body>

<!-- Fond animé -->
<div class="bg-drops" id="bgDrops"></div>

<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo">
    <i class="bi bi-droplet-fill text-white" style="font-size:2rem"></i>
  </div>

  <h4 class="text-center fw-bold mb-0" style="color:var(--primary)">Bilan Hydrique</h4>
  <p class="text-center text-muted small mb-3">Thornthwaite &amp; Turc — Madagascar</p>

  <!-- Alertes -->
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }} alert-dismissible fade show py-2 px-3 small mb-3">
        <i class="bi bi-{% if msg.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %} me-1"></i>
        {{ msg }}
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <!-- Formulaire -->
  <form method="post" novalidate>
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label fw-semibold small" style="color:var(--primary)">
        <i class="bi bi-person me-1"></i>Nom d'utilisateur
      </label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
        <input type="text" name="username" class="form-control" placeholder="Votre identifiant"
               autocomplete="username" autofocus required
               value="{{ request.POST.username|default:'' }}">
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold small" style="color:var(--primary)">
        <i class="bi bi-lock me-1"></i>Mot de passe
      </label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
        <input type="password" name="password" id="pwd" class="form-control"
               placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pwd btn" onclick="togglePwd('pwd','eyePwd')">
          <i class="bi bi-eye" id="eyePwd"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-login btn-primary w-100 text-white">
      <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
    </button>
  </form>

  <div class="divider my-3">ou</div>

  <div class="text-center">
    <p class="mb-0 small text-muted">Pas encore de compte ?</p>
    <a href="{% url 'register' %}" class="btn btn-outline-primary btn-sm mt-2 px-4 fw-semibold">
      <i class="bi bi-person-plus me-1"></i>Créer un compte
    </a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Bulles flottantes
const container = document.getElementById('bgDrops');
for (let i = 0; i < 18; i++) {
  const d = document.createElement('div');
  d.className = 'drop';
  const size = 20 + Math.random() * 80;
  d.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    animation-duration:${8 + Math.random()*12}s;
    animation-delay:${Math.random()*10}s;
  `;
  container.appendChild(d);
}

function togglePwd(inputId, iconId) {
  const inp = document.getElementById(inputId);
  const ico = document.getElementById(iconId);
  if (inp.type === 'password') {
    inp.type = 'text';
    ico.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    ico.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>
